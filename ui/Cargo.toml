[package]
name = "genetic_algo_ui"
version = "0.1.0"
edition = "2024"
description = "Graphical front end for the evolution sandbox."
license = "MIT"
repository = "https://github.com/riccardogabellone/genetic_algo"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.38"
genetic_algo = { path = ".." }
rand = "0.10"

[dev-dependencies]
egui_kittest = "0.37"
