name: Release

# A `v*` tag builds the installers on all three systems and publishes them as a GitHub
# release. A pull request that touches packaging builds them too, without publishing,
# so packaging breaks in the PR instead of at release time.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "assets/icons/**"
      - "packaging/**"
      - "ui/Cargo.toml"
      - "ui/build.rs"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Windows build must embed the app icon; see ui/build.rs.
  REQUIRE_WINDOWS_ICON: "1"

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner, so the binary runs on older glibc versions too.
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: windows-latest
            formats: nsis,wix
          - os: macos-latest
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "genetic_algo_ui") | .version')
          test "${GITHUB_REF_NAME}" = "v${version}" \
            || { echo "tag ${GITHUB_REF_NAME} does not match ui version ${version}"; exit 1; }
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype-dev
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Build the installers
        working-directory: ui
        run: cargo packager --release --formats ${{ matrix.formats }}
      - name: Add a portable Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object name -eq genetic_algo_ui | Select-Object -ExpandProperty version
          Compress-Archive -Path target/release/genetic_algo_ui.exe, LICENSE `
            -DestinationPath "target/packages/genetic_algo_ui_${version}_x64-portable.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.exe
            target/packages/*.msi
            target/packages/*.zip
            target/packages/*.dmg

  publish:
    name: Publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true
      # GitHub replaces spaces in asset names with dots on upload, which would leave
      # checksums.txt naming files that do not exist ("Genetic Algo_..." for the dmg).
      - name: Remove spaces from file names
        working-directory: dist
        run: for file in *' '*; do [ -e "$file" ] && mv "$file" "${file// /_}"; done; ls
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > checksums.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
